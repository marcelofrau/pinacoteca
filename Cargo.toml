[workspace]
resolver = "2"
members = [
    "crates/pinacoteca-app",
    "crates/pinacoteca-core",
    "crates/pinacoteca-decoders",
    "crates/pinacoteca-db",
    "crates/pinacoteca-render",
    "crates/pinacoteca-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
authors = ["Marcelo Frau"]
repository = "https://github.com/marcelofrau/pinacoteca"
homepage = "https://github.com/marcelofrau/pinacoteca"

[workspace.dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Local crates are optimised too: the resize and thumbnail path lives in our own
# code, and `cargo run` in debug was ~16x slower without this (M3-Completeness).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
